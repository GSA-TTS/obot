name: Build cloud.gov Image

# Builds the Cloud Foundry / cloud.gov variant of the Obot image and pushes it
# to GHCR. Separate from docker-build-and-push.yml because that workflow builds
# on Depot (upstream's infrastructure, which this fork cannot use) and bakes in
# the upstream providers image.
#
# The image this produces differs from upstream's only in that it:
#   1. contains cf-entrypoint.sh and jq (see Dockerfile), and
#   2. optionally bakes in a custom providers layer carrying the login.gov auth
#      provider built from GSA-TTS/mcp-server-hub-tools.
#
# The image must be PUBLIC: cloud.gov pulls it with no registry credentials.

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      providers_image:
        description: >-
          Providers image to bake in. Use the GSA providers image to include the
          login.gov auth provider; leave as upstream for a vanilla build.
        required: true
        default: ghcr.io/obot-platform/providers:latest
      tag_suffix:
        description: "Extra tag to apply alongside cloudgov-<sha> (e.g. 'latest')"
        required: false
        default: ""
  push:
    branches:
      - cloudgov-phase1
    paths:
      - "cf-entrypoint.sh"
      - "Dockerfile"
      - "pkg/mcp/cloudfoundry*.go"
      - ".github/workflows/cloudgov-image.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Upstream builds this image on Depot. On a standard 4-CPU runner the Go
    # build plus the pnpm UI build is slow, and the default 360-minute ceiling
    # would burn six hours before reporting a hang. 90 is generous for a cold
    # cache and fails fast on a genuine stall.
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so `go build` derives a real version rather than
          # v0.0.0-<ts>-<rev>, which trips vulnerability scanners.
          fetch-depth: 0

      # Verify the entrypoint is syntactically valid and lint-clean before
      # spending ~15 minutes on an image build. A shell typo here does not
      # surface until the app crash-loops on cloud.gov.
      - name: Lint cf-entrypoint.sh
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          bash -n cf-entrypoint.sh
          shellcheck cf-entrypoint.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          SUFFIX: ${{ inputs.tag_suffix }}
        run: |
          # Docker repository names must be lowercase, but github.repository
          # preserves the org's casing ("GSA-TTS/obot"), which buildx rejects
          # outright: "repository name must be lowercase". Normalize here
          # rather than hardcoding the path, so the workflow still works in a
          # renamed or forked repo.
          base="${REGISTRY}/$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          tags="${base}:cloudgov-${GITHUB_SHA::7}"
          if [ -n "${SUFFIX}" ]; then
            tags="${tags},${base}:cloudgov-${SUFFIX}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${tags}"

      - name: Resolve providers image
        id: providers
        env:
          INPUT_IMAGE: ${{ inputs.providers_image }}
        run: |
          set -euo pipefail
          image="${INPUT_IMAGE:-ghcr.io/obot-platform/providers:latest}"
          if echo "${image}" | grep -qi '^ghcr.io/gsa-tts/' && \
             ! echo "${image}" | grep -q '@sha256:'; then
            echo "::error::GSA providers images must be pinned by digest"
            exit 1
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Providers image: ${image}"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          push: true
          # cloud.gov Diego cells are amd64 only. Building arm64 as well would
          # double build time for an architecture that cannot run there.
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          # BASE_IMAGE is deliberately left at the Dockerfile default
          # (cgr.dev/chainguard/wolfi-base), which installs the Go/pnpm
          # toolchain via apk. Upstream passes a prebuilt
          # ghcr.io/obot-platform/obot/base:latest to skip that, but it builds
          # on Depot; adding an external image dependency we have not verified
          # is public would trade a slow build for a new failure mode. If build
          # time becomes a problem, that arg is the first thing to try.
          build-args: |
            PROVIDERS_IMAGE=${{ steps.providers.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A provider is usable only when its manifest, command, runtime files, and
      # registry path survive assembly into the final Obot image.
      - name: Verify baked-in providers
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          PROVIDERS_IMAGE: ${{ steps.providers.outputs.image }}
        run: |
          set -euo pipefail
          image="$(echo "${TAGS}" | cut -d, -f1)"
          echo "Inspecting ${image}"
          docker pull "${image}"
          echo "--- /obot-providers ---"
          docker run --rm --entrypoint ls "${image}" /obot-providers
          echo "--- cf-entrypoint.sh present and executable ---"
          docker run --rm --entrypoint test "${image}" -x /cf-entrypoint.sh
          echo "--- jq present ---"
          docker run --rm --entrypoint jq "${image}" --version
          if echo "${PROVIDERS_IMAGE}" | grep -qi 'ghcr.io/gsa-tts/'; then
            echo "--- login.gov provider expected (GSA providers image) ---"
            container="$(docker create "${image}")"
            trap 'docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT
            docker cp "${container}:/obot-providers/." /tmp/obot-providers
            registry=/tmp/obot-providers/gsa-tools
            test -x "${registry}/bin/login.gov-auth-provider"
            test -x "${registry}/bin/login.gov-auth-provider.bin"
            test -f "${registry}/auth-providers/login.gov-auth-provider.yaml"
            test -f "${registry}/auth-providers-common/templates/error.html"
            grep -F 'command: bin/login.gov-auth-provider' \
              "${registry}/auth-providers/login.gov-auth-provider.yaml"
            grep -F '/obot-providers/gsa-tools' \
              /tmp/obot-providers/.envrc.providers
            echo "login.gov provider present"
          fi

      - name: Summary
        run: |
          {
            echo "### cloud.gov image built"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tags | \`${{ steps.tags.outputs.tags }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Providers image | \`${{ steps.providers.outputs.image }}\` |"
            echo "| Platform | linux/amd64 |"
            echo
            echo "Set this in \`cloudgov/.env\` as \`OBOT_IMAGE\` and run \`make push\`."
            echo
            echo "> The image must be **public** for cloud.gov to pull it."
          } >> "$GITHUB_STEP_SUMMARY"
