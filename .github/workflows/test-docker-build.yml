name: Test Docker Build

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - 'feat/*'
    paths-ignore:
      - docs/**
      - chart/**
      - .claude/**
      - adr/**
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The GSA fork cannot use upstream's Depot runners or build project.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            BASE_IMAGE=ghcr.io/obot-platform/obot/base:latest

      - name: Load AMD64 image for embedded PostgreSQL tests
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: obot:embedded-postgres-test
          build-args: |
            BASE_IMAGE=ghcr.io/obot-platform/obot/base:latest

      - name: Test embedded PostgreSQL startup and migration
        timeout-minutes: 15
        run: bash tools/test-embedded-postgres.sh obot:embedded-postgres-test

      - name: Upload embedded PostgreSQL test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: embedded-postgres-test-logs
          path: /tmp/obot-embedded-postgres-*/logs/
